name: Build

on:
  push:
    branches: [main, chore/add-ci-cd-pipeline]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Configure CMake (Release)
        run: |
          cmake -G Ninja -S . -B cmake-build-release `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MAKE_PROGRAM=ninja

      - name: Build Release
        run: cmake --build cmake-build-release --target printer_agent

      - name: Verify executable
        run: |
          if (-not (Test-Path cmake-build-release\printer_agent.exe)) {
            throw "Build failed: printer_agent.exe not found"
          }
          Write-Host "✓ Build successful: cmake-build-release\printer_agent.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: printer_agent
          path: |
            cmake-build-release/printer_agent.exe
            cmake-build-release/agent.ini
            cmake-build-release/install_service.bat
            cmake-build-release/uninstall_service.bat
          retention-days: 30
