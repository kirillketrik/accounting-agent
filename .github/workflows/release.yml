name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Configure and Build CMake (Release)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -G Ninja -S . -B cmake-build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=ninja
          cmake --build cmake-build-release --target printer_agent

      - name: Create distribution package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\printer-agent
          Copy-Item cmake-build-release\printer_agent.exe dist\printer-agent\
          Copy-Item cmake-build-release\agent.ini dist\printer-agent\
          Copy-Item cmake-build-release\install_service.bat dist\printer-agent\
          Copy-Item cmake-build-release\uninstall_service.bat dist\printer-agent\
          Copy-Item README.md dist\printer-agent\
          Copy-Item LICENSE dist\printer-agent\
          Compress-Archive -Path dist\printer-agent -DestinationPath dist\printer-agent.zip
          Write-Host "✓ Package created: dist\printer-agent.zip"

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/printer-agent.zip
            cmake-build-release/printer_agent.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
